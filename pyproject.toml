[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hmecli"
version = "0.1.0"
description = "Generate iCloud Hide My Email aliases from the command line"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["browser-cookie3"]
keywords = ["icloud", "hide-my-email", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/nuclearcanopy/hmecli"
Issues = "https://github.com/nuclearcanopy/hmecli/issues"

[project.scripts]
hmecli = "hmecli:main"

[tool.setuptools]
py-modules = ["hmecli"]
